name: App Write
# Canary dummy. Same key access as App Merge, used to try writes the App must not be able to do.
on:
  workflow_dispatch:
    inputs:
      mode: {required: true}
      pr: {required: false}
      label: {required: true}
run-name: ${{ inputs.label }}
permissions: {}
jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: merge-actor
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          MODE: ${{ inputs.mode }}
          LABEL: ${{ inputs.label }}
          PR: ${{ inputs.pr }}
        run: |
          set -o pipefail
          name=$(echo "$LABEL" | tr -c 'a-z0-9' '-')
          case "$MODE" in
            push-main) gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/app/$name.txt" -f message=canary -f content=eA== -f branch=main --jq .commit.sha 2>&1 | sed 's/^/RESULT /' ;;
            move-main-ref) sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha); gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/main" -f sha="$sha" -F force=false 2>&1 | sed 's/^/RESULT /' ;;
            approve) gh api -X POST "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" -f event=APPROVE --jq '[.state,.user.login]|@tsv' 2>&1 | sed 's/^/RESULT /' ;;
            edit-workflow) gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/.github/workflows/$name.yml" -f message=canary -f content=eA== -f branch=main --jq .commit.sha 2>&1 | sed 's/^/RESULT /' ;;
          esac
