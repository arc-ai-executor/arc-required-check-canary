name: Branch Writer n2
# Canary dummy, defined only on this branch. Can a definition that is not on main use the power?
on:
  push:
    branches: [b2-n2-def]
permissions:
  contents: write
  pull-requests: write
jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/writer/n2.txt" -f message=canary -f content=eA== -f branch=main --jq .commit.sha 2>&1 | sed 's/^/RESULT /'
